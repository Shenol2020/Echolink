<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crowd Lights — Operator Login</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --line: #262b33;
    --text: #e8eaed;
    --muted: #8a909c;
    --accent: #ff5a36;
    --accent-dim: #7a2c1c;
    --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 36px 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  p.sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .field {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  input[type="password"] {
    width: 100%;
    background: #0b0d10;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 16px;
    font-family: var(--mono);
    padding: 12px 14px;
    transition: border-color .15s;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .submit-btn {
    width: 100%;
    background: var(--accent);
    color: #1a0a05;
    border: none;
    border-radius: 8px;
    padding: 13px 20px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: filter .15s;
  }
  .submit-btn:hover {
    filter: brightness(1.08);
  }
  .submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .error-msg {
    color: #ff5a5a;
    font-size: 13px;
    margin-top: 14px;
    min-height: 18px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">EchoLink · Security</div>
  <h1>Operator Console</h1>
  <p class="sub">Enter your operator passcode to unlock lighting control and session setup.</p>
  
  <form id="login-form">
    <div class="field">
      <label for="password">Passcode</label>
      <input type="password" id="password" autocomplete="current-password" required placeholder="Enter operator passcode" autofocus />
    </div>
    <button type="submit" class="submit-btn" id="submit-btn">Unlock Console →</button>
    <div class="error-msg" id="error-msg"></div>
  </form>
</div>

<script>
(function() {
  const form = document.getElementById('login-form');
  const passInput = document.getElementById('password');
  const submitBtn = document.getElementById('submit-btn');
  const errorMsg = document.getElementById('error-msg');

  function sanitizeRedirect(target) {
    if (!target || typeof target !== 'string') return '/dashboard';
    const trimmed = target.trim();
    if (trimmed.startsWith('/') && !trimmed.startsWith('//') && !trimmed.includes('\\') && !trimmed.includes(':')) {
      return trimmed;
    }
    return '/dashboard';
  }

  const params = new URLSearchParams(window.location.search);
  const redirectTarget = sanitizeRedirect(params.get('redirect'));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';
    submitBtn.disabled = true;

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: passInput.value }),
      });
      const data = await res.json();
      if (res.ok && data.success) {
        if (data.token) {
          sessionStorage.setItem('echolink_token', data.token);
        }
        window.location.href = redirectTarget;
      } else {
        errorMsg.textContent = data.message || 'Incorrect passcode. Access denied.';
        passInput.focus();
        passInput.select();
      }
    } catch {
      errorMsg.textContent = 'Server connection error. Please try again.';
    } finally {
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
